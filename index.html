<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆枪突击 - 战力速查表</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
            background: #fff; color: #333;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        h1 { margin-bottom: 8px; font-size: 1.5em; color: #222; }
        .desc { margin-bottom: 20px; color: #666; font-size: 0.85em; line-height: 1.8; max-width: 900px; text-align: center; }
        .site-footer { margin: 4px 0 12px; color: #777; font-size: 0.85em; }
        .site-footer a { color: #1a6dcc; text-decoration: none; font-weight: 600; }
        .site-footer a:hover { text-decoration: underline; }
        .site-footer .sep { margin: 0 12px; color: #ccc; }
        .table-wrapper { overflow-x: auto; max-width: 100%; }
        table { border-collapse: collapse; font-size: 0.85em; margin-bottom: 28px; }
        th, td {
            border: 1px solid #ccc; padding: 8px 14px;
            text-align: center; white-space: nowrap;
        }
        td.row-label, th.corner { text-align: center; }
        th {
            background: #e8e8e8; color: #333; font-weight: 600;
        }
        th.corner { background: #ddd; }
        th.row-label, td.row-label {
            text-align: center; font-weight: 600;
            background: #e8e8e8; color: #333;
        }
        td { font-variant-numeric: tabular-nums; }
        tbody tr:nth-child(even) td { background: #f5f5f5; }
        tbody tr:nth-child(odd) td { background: #fff; }
        td.row-label { background: #e8e8e8 !important; }
        tfoot td { background: #f0f0f0; color: #555; font-size: 0.82em; }
        .loading { padding: 40px; color: #999; font-size: 1.1em; }
    </style>
</head>
<body>
    <h1>爆枪突击 - 极限战力速查表</h1>
    <p class="desc">
      数据基于当前版本极限配置：极限军队（109级）+ 军衔（联邦大元帅），计算结果与游戏实际分毫不差，可以放心参考。<br>
      总统配置均为对应VIP等级的极限额度；v4及以下载具为雷霆，v5及以上载具为盖亚。
    </p>
    <div class="table-wrapper"></div>
    <div id="loading-msg" class="loading">正在计算中…</div>
    <footer class="site-footer">
      实时更新 <a href="https://bqyx-query.onrender.com/" target="_blank" rel="noopener">bqyx-query.onrender.com</a>
      <span class="sep">·</span>
      开源仓库 <a href="https://github.com/zzl-Jiang/bqtj-calculator" target="_blank" rel="noopener">github.com/zzl-Jiang/bqtj-calculator</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
